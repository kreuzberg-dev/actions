name: Publish to Maven Central via Gradle
description: >
  Publish a Gradle-built JVM project (Kotlin, Java/Gradle, or Android library)
  to Maven Central with GPG signing. Wraps the standard `signing` +
  `maven-publish` Gradle plugins, or a higher-level publish task such as the
  one provided by `com.vanniktech.maven.publish`.

  Auth via env: `MAVEN_USERNAME`, `MAVEN_PASSWORD` (Sonatype Central Portal
  user token), `MAVEN_GPG_PASSPHRASE`. The GPG private key is imported from
  the `MAVEN_GPG_PRIVATE_KEY` env var (ASCII-armored), or — if you already
  ran `actions/setup-java@v5` with `gpg-private-key`/`gpg-passphrase` — you
  can omit it here.

inputs:
  working-directory:
    description: "Directory containing the Gradle project (build.gradle/.kts)"
    required: false
    default: "."
  gradle-task:
    description: >
      Gradle task to invoke. Common values:
        - `publishAndReleaseToMavenCentral` (vanniktech plugin, recommended)
        - `publishToMavenCentral` (vanniktech, leaves staging open)
        - `publish` (vanilla maven-publish, requires manual staging close on Central Portal)
    required: false
    default: "publishAndReleaseToMavenCentral"
  extra-args:
    description: "Additional Gradle arguments (space-separated)"
    required: false
    default: ""
  no-daemon:
    description: "Pass --no-daemon to gradle (recommended in CI)"
    required: false
    default: "true"
  setup-gradle:
    description: "Run gradle/actions/setup-gradle. Set to 'false' if already configured."
    required: false
    default: "true"
  java-version:
    description: "JDK version to install via setup-java (no-op if setup-java is 'false')"
    required: false
    default: "25"
  setup-java:
    description: "Run actions/setup-java@v5. Set to 'false' if already configured."
    required: false
    default: "true"
  dry-run:
    description: "Print the gradle command instead of executing"
    required: false
    default: "false"
  expected-version:
    description: >
      Version of the release being published (a leading `v` and a `-dryrun-<sha>` suffix are
      stripped). When set, the version the Gradle project would publish must equal this or the
      action fails before publishing. Leaving it empty preserves the old behaviour but disables
      the stale-artifact guard, and the action warns loudly.
    required: false
    default: ""

outputs:
  skipped:
    description: "Whether the publish was skipped because the version was already released"
    value: ${{ steps.publish.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Set up JDK
      if: inputs.setup-java == 'true'
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin

    - name: Set up Gradle
      if: inputs.setup-gradle == 'true'
      uses: gradle/actions/setup-gradle@v6

    - name: Import GPG key
      if: env.MAVEN_GPG_PRIVATE_KEY != ''
      shell: bash
      env:
        MAVEN_GPG_PRIVATE_KEY: ${{ env.MAVEN_GPG_PRIVATE_KEY }}
        MAVEN_GPG_PASSPHRASE: ${{ env.MAVEN_GPG_PASSPHRASE }}
      run: |
        # Try importing as raw (armored) first; on failure, try base64-decoded.
        # GH Actions log-masks any substring that matches a registered secret,
        # so prefix-detection via a literal armor-header grep is brittle.
        # Trying both forms unconditionally is simpler and more robust.
        gpg_err=$(mktemp)
        if printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import 2>"$gpg_err"; then
          echo "Imported MAVEN_GPG_PRIVATE_KEY as armored OpenPGP"
        elif printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | base64 -d 2>/dev/null | gpg --batch --import 2>"$gpg_err"; then
          echo "Imported MAVEN_GPG_PRIVATE_KEY (base64-decoded)"
        else
          echo "Error: MAVEN_GPG_PRIVATE_KEY could not be imported as armored OpenPGP or base64-encoded OpenPGP." >&2
          echo "gpg output from last attempt:" >&2
          sed 's/^/  /' "$gpg_err" >&2
          exit 1
        fi
        rm -f "$gpg_err"
        # Make the key usable for non-interactive signing
        for fpr in $(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" {print $10; exit}'); do
          echo "$fpr:6:" | gpg --import-ownertrust
        done

    - name: Verify required env
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        MAVEN_USERNAME: ${{ env.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ env.MAVEN_PASSWORD }}
      run: |
        missing=0
        for v in MAVEN_USERNAME MAVEN_PASSWORD; do
          if [[ -z "${!v:-}" ]]; then
            echo "Error: $v not set" >&2
            missing=1
          fi
        done
        if [[ -z "${MAVEN_GPG_PASSPHRASE:-}" ]]; then
          echo "Warning: MAVEN_GPG_PASSPHRASE not set — signing will fail unless gpg-agent has the passphrase cached." >&2
        fi
        [[ $missing -eq 0 ]] || exit 1

    - name: Verify the Gradle project version matches the release
      id: verify-version
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        NO_DAEMON: ${{ inputs.no-daemon }}
        INPUT_EXPECTED_VERSION: ${{ inputs.expected-version }}
      run: |
        set -euo pipefail
        # ~keep This pre-flight is what makes the "already published, skipping" branch of the
        # publish step safe, and the two must not be collapsed. That branch matches the broadest
        # pattern of any publish action here over arbitrary Gradle output with no version
        # anchoring, so a stale project resolves to a skip: tree-sitter-language-pack v1.16.0 and
        # liter-llm v1.19.0 both reported success having published nothing because a stale
        # artifact matched an already-published check for a version that was already live.
        # Skipping is legitimate ONLY once the project version is known to be the release version.
        if [[ -z "${INPUT_EXPECTED_VERSION:-}" ]]; then
          echo "::warning::publish-maven-gradle was invoked without expected-version; a stale artifact cannot be detected and an 'already published' response will be treated as an idempotent skip. Pass the release version from the caller to close this gap."
          exit 0
        fi
        expected="${INPUT_EXPECTED_VERSION#v}"
        # ~keep A dry run synthesizes its tag as `<version>-dryrun-<sha>` (see
        # prepare-release-metadata), a version no manifest will ever hold. Strip the suffix
        # rather than skipping the assertion on dry runs: a dry run is exactly where a stale
        # checkout should surface, while nothing has been published yet.
        expected="${expected%%-dryrun-*}"
        cd "$WORKING_DIR"

        gradle_flags=()
        if [[ "$NO_DAEMON" == "true" ]]; then
          gradle_flags+=(--no-daemon)
        fi

        # gradle.properties is the cheap, exact source when the project uses it. Build scripts
        # (build.gradle/.kts) cannot be parsed reliably by grep, so fall back to asking Gradle
        # itself — `gradle properties -q` prints a `version: <x>` line for the resolved project.
        version=""
        if [[ -f gradle.properties ]]; then
          version=$(grep -E '^[[:space:]]*version[[:space:]]*=' gradle.properties | head -1 | cut -d= -f2- | tr -d " \"'" || true)
        fi
        if [[ -z "$version" || "$version" == "unspecified" ]]; then
          version=$(gradle properties -q "${gradle_flags[@]}" 2>/dev/null | grep -E '^version:' | head -1 | cut -d: -f2- | tr -d " \"'" || true)
        fi

        # ~keep Neither source above can see a version declared only in the vanniktech plugin's
        # `coordinates(...)` block, which is where every Kotlin Android package in this org
        # declares it: `project.version` is never assigned, so `gradle properties -q` prints
        # `version: unspecified` and this guard could not run at all on the packages it exists
        # for. The generated POM carries the version Maven Central will index, so ask Gradle to
        # write it and read that instead. POMs left by an earlier build are deleted first — a
        # stale POM satisfying the guard would be the very failure this step is here to catch.
        if [[ -z "$version" || "$version" == "unspecified" ]]; then
          find . -path '*/build/publications/*/pom-default.xml' -delete 2>/dev/null || true
          init_script=$(mktemp -t alef-pom-probe.XXXXXX)
          cat >"$init_script" <<'INIT_SCRIPT'
        allprojects {
            tasks.register("alefGeneratePomFiles") {
                dependsOn(tasks.matching { it.name.startsWith("generatePomFileFor") && it.name.endsWith("Publication") })
            }
        }
        INIT_SCRIPT
          gradle -q -I "$init_script" alefGeneratePomFiles "${gradle_flags[@]}" >/dev/null 2>&1 || true
          rm -f "$init_script"
          version=$(python3 -c '
        import glob
        import xml.etree.ElementTree as ElementTree

        versions = set()
        for path in glob.glob("**/build/publications/*/pom-default.xml", recursive=True):
            root = ElementTree.parse(path).getroot()
            namespace = root.tag[: root.tag.index("}") + 1] if root.tag.startswith("{") else ""
            found = (root.findtext(namespace + "version") or "").strip()
            if found:
                versions.add(found)
        print(versions.pop() if len(versions) == 1 else "")
        ' || true)
        fi

        if [[ -z "$version" || "$version" == "unspecified" ]]; then
          echo "::error::expected-version ${expected} was supplied but the version this project would publish could not be determined in ${WORKING_DIR} (no version in gradle.properties, 'gradle properties -q' reported none, and no single version could be read from a generated POM), so the artifact cannot be verified"
          exit 1
        fi
        if [[ "$version" != "$expected" ]]; then
          echo "::error::the Gradle project would publish version ${version} but the release being published is ${expected}. The artifact is stale; publishing it would ship the wrong version or be silently swallowed as an 'already published' skip."
          exit 1
        fi
        echo "Verified the Gradle project carries the release version ${expected}"

    - name: Publish via Gradle
      id: publish
      shell: bash
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ env.MAVEN_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ env.MAVEN_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ env.MAVEN_GPG_PRIVATE_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ env.MAVEN_GPG_PASSPHRASE }}
        WORKING_DIR: ${{ inputs.working-directory }}
        GRADLE_TASK: ${{ inputs.gradle-task }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        NO_DAEMON: ${{ inputs.no-daemon }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        cd "$WORKING_DIR"

        FLAGS=""
        if [[ "$NO_DAEMON" == "true" ]]; then
          FLAGS="$FLAGS --no-daemon"
        fi

        if [[ "$DRY_RUN" == "true" ]]; then
          echo "[dry-run] Would run: gradle $GRADLE_TASK $FLAGS $EXTRA_ARGS"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        set +e
        # shellcheck disable=SC2086
        output=$(gradle $GRADLE_TASK $FLAGS $EXTRA_ARGS 2>&1)
        exit_code=$?
        set -e

        echo "$output"

        if [[ $exit_code -eq 0 ]]; then
          echo "Published successfully via gradle $GRADLE_TASK"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
        elif echo "$output" | grep -qiE "already (released|published|exists)|conflict.*version|409.*conflict"; then
          echo "Artifact already published, skipping"
          echo "skipped=true" >> "$GITHUB_OUTPUT"
        else
          echo "Gradle publish failed:" >&2
          echo "$output" >&2
          exit $exit_code
        fi
