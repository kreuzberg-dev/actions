name: Setup C/C++ Tools
description: |
  Install the C/C++ toolchain used by xberg-io pre-commit hooks (cppcheck,
  clang-format, shellcheck). Pins cppcheck to the version expected by
  xberg-io/pre-commit-hooks (currently 2.20.0) — Ubuntu's stock package is
  too old, so cppcheck is built from source via CMake when not already on PATH
  at the expected version. clang-format is pinned to the same version on every
  platform, since its output decides whether `poly fmt --check` passes.

inputs:
  cppcheck-version:
    description: cppcheck version to install (must match the pin in xberg-io/pre-commit-hooks)
    required: false
    default: "2.20.0"
  clang-format-version:
    description: >-
      clang-format version to install, from the PyPI wheel so every platform gets the same binary.
      Its output gates `poly fmt --check`, so this must stay pinned — apt and brew disagree, and
      clang-format 18 misformats C# nullable types.
    required: false
    default: "22.1.8"
  install-clang-format:
    description: Install clang-format.
    required: false
    default: "true"
  install-cppcheck:
    description: >-
      Install cppcheck. Turn this off for jobs that only need clang-format — on Linux a
      version miss builds cppcheck from source, which costs minutes.
    required: false
    default: "true"
  install-shellcheck:
    description: Install shellcheck via apt (Linux only).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # ~keep uv is installed here rather than assumed from the caller because clang-format
    # ships as a PyPI wheel and needs a venv to land in. `python3 -m venv` requires
    # ensurepip, which some runner images' system python lacks ("you need to install the
    # python3-venv package"), so this action used to fail for any caller that had not
    # separately run setup-python — an undeclared dependency that took xberg-enterprise's
    # Validate down at "Set up clang-format". uv builds the venv itself and fetches its own
    # interpreter when none is suitable, so the install no longer depends on the caller.
    - name: Set up uv
      if: ${{ inputs.install-clang-format == 'true' }}
      uses: astral-sh/setup-uv@v10.0.0

    - name: Install C/C++ tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        CPPCHECK_VERSION: ${{ inputs.cppcheck-version }}
        CLANG_FORMAT_VERSION: ${{ inputs.clang-format-version }}
        INSTALL_CLANG_FORMAT: ${{ inputs.install-clang-format }}
        INSTALL_CPPCHECK: ${{ inputs.install-cppcheck }}
        INSTALL_SHELLCHECK: ${{ inputs.install-shellcheck }}
      run: |
        "${{ github.action_path }}/scripts/linux.sh"

    - name: Install C/C++ tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        CPPCHECK_VERSION: ${{ inputs.cppcheck-version }}
        CLANG_FORMAT_VERSION: ${{ inputs.clang-format-version }}
        INSTALL_CLANG_FORMAT: ${{ inputs.install-clang-format }}
        INSTALL_CPPCHECK: ${{ inputs.install-cppcheck }}
        INSTALL_SHELLCHECK: ${{ inputs.install-shellcheck }}
      run: |
        "${{ github.action_path }}/scripts/macos.sh"
