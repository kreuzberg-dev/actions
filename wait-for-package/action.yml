name: Wait for Package Indexing
description: >
  Poll a package registry until a specific version becomes available.
  Supports cratesio, hex, maven, npm, nuget, packagist, pypi and rubygems registries.
  Uses exponential backoff with configurable max attempts.

inputs:
  registry:
    description: "Registry to poll (cratesio, hex, maven, npm, nuget, packagist, pypi, rubygems)"
    required: true
  package:
    description: >
      Package name (e.g. @scope/pkg for npm, crate-name for crates.io,
      vendor/name for packagist, group:artifact or a bare artifact id for maven).
    required: true
  version:
    description: "Semantic version to wait for (e.g., 1.2.3)"
    required: true
  max-attempts:
    description: "Maximum number of polling attempts"
    required: false
    default: "10"
  maven-group-id:
    description: >
      Maven group ID. Only needed when `package` is a bare artifact id; a
      `group:artifact` package already carries the group.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Wait for package indexing
      shell: bash
      env:
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        INPUT_MAVEN_GROUP_ID: ${{ inputs.maven-group-id }}
      run: |
        python3 "${{ github.action_path }}/scripts/wait.py"
