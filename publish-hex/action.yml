name: Publish to Hex.pm
description: >
  Publish Elixir packages to Hex.pm using mix hex.publish. Optionally accepts
  a pre-built Hex source tarball (.tar) from build-elixir-hex@v1 to avoid
  double-building; when tarball-path is set, publishes that artifact instead
  of rebuilding from source.

inputs:
  package-dir:
    description: "Directory containing the Elixir project"
    required: false
    default: "."
  replace:
    description: "Allow replacing an existing version"
    required: false
    default: "true"
  skip-docs:
    description: "Skip generating docs (needed for NIF packages without pre-built binaries)"
    required: false
    default: "false"
  dry-run:
    description: "Perform a dry run without actually publishing"
    required: false
    default: "false"
  tarball-path:
    description: "Optional path to a pre-built Hex source tarball (.tar). When set, publishes this tarball instead of rebuilding. Recommended pairing: output from build-elixir-hex@v1."
    required: false
    default: ""
  expected-version:
    description: >
      Version of the release being published (a leading `v` is stripped). When set, the
      mix.exs version must equal this or the action fails before publishing.
      Leaving it empty preserves the old behaviour but disables the stale-artifact guard,
      and the action warns loudly.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Elixir and OTP
      uses: erlef/setup-beam@v1
      with:
        elixir-version: "1.19"
        otp-version: "28"

    - name: Verify mix.exs carries the release version
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
        INPUT_EXPECTED_VERSION: ${{ inputs.expected-version }}
      run: |
        # ~keep One pre-flight guards BOTH publish steps below (pre-built tarball and rebuild);
        # it is what makes their "already published, skipping" branches safe, and the two must not
        # be collapsed. The widest hole is `can only modify a release`, which Hex returns >1h after
        # the original push and says nothing about WHICH version is live — so a stale project
        # resolves to a skip. tree-sitter-language-pack v1.16.0 and liter-llm v1.19.0 both reported
        # success having published nothing that way. Skipping is legitimate ONLY once the mix.exs
        # version is known to be the release version.
        if [[ -z "${INPUT_EXPECTED_VERSION:-}" ]]; then
          echo "::warning::publish-hex was invoked without expected-version; a stale artifact cannot be detected and an 'already published' response will be treated as an idempotent skip. Pass the release version from the caller to close this gap."
          exit 0
        fi
        expected="${INPUT_EXPECTED_VERSION#v}"
        cd "$PACKAGE_DIR"
        # mix.exs is Elixir source, not a config file: read the literal `version: "x"` from
        # project/0, and fall back to the `@version "x"` module attribute that projects computing
        # their version dynamically (`version: @version`) use instead.
        version=$(grep -oE 'version: *"[^"]+"' mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
        if [[ "$version" == *'#{'* ]]; then
          version=""
        fi
        if [[ -z "$version" ]]; then
          version=$(grep -oE '@version +"[^"]+"' mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
        fi
        if [[ -z "$version" ]]; then
          echo "::error::expected-version ${expected} was supplied but no version could be read from ${PACKAGE_DIR}/mix.exs (neither a literal 'version:' nor a '@version' attribute), so the package cannot be verified"
          exit 1
        fi
        if [[ "$version" != "$expected" ]]; then
          echo "::error::mix.exs declares version ${version} but the release being published is ${expected}. The package is stale; publishing it would ship the wrong version or be silently swallowed as an 'already published' skip."
          exit 1
        fi
        echo "Verified mix.exs carries the release version ${expected}"

    - name: Verify Hex.pm availability
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        HEX_API_KEY: ${{ env.HEX_API_KEY }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        if [[ -z "${HEX_API_KEY:-}" ]]; then
          echo "Error: HEX_API_KEY environment variable not set" >&2
          exit 1
        fi
        cd "$PACKAGE_DIR"
        mix local.hex --force
        mix local.rebar --force

    - name: Fetch Mix dependencies
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        cd "$PACKAGE_DIR"
        mix deps.get

    - name: Generate Cargo.lock for native dependencies
      if: inputs.dry-run != 'true' && inputs.tarball-path == ''
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        set -euo pipefail
        cd "$PACKAGE_DIR"
        # Find and generate Cargo.lock for any native Rust dependencies
        for cargo_toml in $(find native -name "Cargo.toml" 2>/dev/null || true); do
          cargo_dir=$(dirname "$cargo_toml")
          echo "Generating ${cargo_dir}/Cargo.lock via cargo generate-lockfile"
          cd "${GITHUB_WORKSPACE}/${PACKAGE_DIR}/${cargo_dir}"
          cargo generate-lockfile
          cd "${GITHUB_WORKSPACE}/${PACKAGE_DIR}"
        done

    - name: Publish to Hex.pm (pre-built tarball)
      if: inputs.dry-run != 'true' && inputs.tarball-path != ''
      shell: bash
      env:
        HEX_API_KEY: ${{ env.HEX_API_KEY }}
        REPLACE: ${{ inputs.replace }}
        TARBALL_PATH: ${{ inputs.tarball-path }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        if [[ ! -f "$TARBALL_PATH" ]]; then
          echo "Error: tarball not found at $TARBALL_PATH" >&2
          exit 1
        fi
        # Hex has no CLI to publish a pre-built .tar: `mix hex.publish` always
        # (re)builds the package from the Mix project in the working directory —
        # passing the tarball as a positional makes hex reject the invocation
        # with "** (Mix) Invalid arguments". The upstream build-elixir-hex step
        # already rewrote workspace path-deps to registry deps *in place* in
        # $PACKAGE_DIR and ran `mix hex.build`, so publishing from that same
        # directory reproduces a byte-identical package. The tarball-path input
        # is retained purely as a build-success guard (verified above).
        # `mix hex.publish` needs a Mix.Project in cwd, so cd into the package dir.
        cd "$PACKAGE_DIR"
        PUBLISH_FLAGS="package --yes"
        if [[ "$REPLACE" == "true" ]]; then
          PUBLISH_FLAGS="${PUBLISH_FLAGS} --replace"
        fi
        set +e
        # shellcheck disable=SC2086
        output=$(mix hex.publish $PUBLISH_FLAGS 2>&1)
        exit_code=$?
        set -e

        echo "$output"

        if [[ $exit_code -eq 0 ]]; then
          echo "Published successfully"
        elif echo "$output" | grep -qi "already published\|version already exists\|already been published\|can only modify a release"; then
          # Hex returns "can only modify a release up to one hour after publication"
          # when a re-publish lands >1h after the original push. The release is
          # already live, so treat as success-equivalent skip.
          echo "Package already published, skipping"
        else
          echo "Error publishing:" >&2
          echo "$output" >&2
          exit 1
        fi

    - name: Publish to Hex.pm (rebuild)
      if: inputs.dry-run != 'true' && inputs.tarball-path == ''
      shell: bash
      env:
        HEX_API_KEY: ${{ env.HEX_API_KEY }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
        REPLACE: ${{ inputs.replace }}
        SKIP_DOCS: ${{ inputs.skip-docs }}
      run: |
        cd "$PACKAGE_DIR"
        PUBLISH_FLAGS="--yes"
        if [[ "$REPLACE" == "true" ]]; then
          PUBLISH_FLAGS="${PUBLISH_FLAGS} --replace"
        fi
        if [[ "$SKIP_DOCS" == "true" ]]; then
          PUBLISH_FLAGS="package ${PUBLISH_FLAGS}"
        fi
        set +e
        # shellcheck disable=SC2086
        output=$(mix hex.publish $PUBLISH_FLAGS 2>&1)
        exit_code=$?
        set -e

        echo "$output"

        if [[ $exit_code -eq 0 ]]; then
          echo "Published successfully"
        elif echo "$output" | grep -qi "already published\|version already exists\|already been published\|can only modify a release"; then
          # Hex returns "can only modify a release up to one hour after publication"
          # when a re-publish lands >1h after the original push. The release is
          # already live, so treat as success-equivalent skip.
          echo "Package already published, skipping"
        else
          echo "Error publishing:" >&2
          echo "$output" >&2
          exit 1
        fi

    - name: Dry run
      if: inputs.dry-run == 'true'
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        cd "$PACKAGE_DIR"
        echo "[dry-run] Would run: mix hex.publish --yes"
        mix hex.info 2>/dev/null || echo "  (mix hex.info not available)"
