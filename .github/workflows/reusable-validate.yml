name: Validate

on:
  workflow_call:
    inputs:
      setup-rust:
        description: "Install the Rust toolchain (needed when poly.toml enables the cargo/clippy hook)."
        required: false
        type: boolean
        default: false
      rust-components:
        description: "rustup components for setup-rust."
        required: false
        type: string
        default: "rustfmt, clippy"
      setup-python:
        description: "Install a Python env so poly's pyrefly type-check can resolve imports."
        required: false
        type: boolean
        default: false
      python-version:
        description: "Python version for setup-python-env."
        required: false
        type: string
        default: "3.13"
      python-extra-projects:
        description: >-
          Newline-separated project directories to install into the synced venv (`uv pip install -e`).
          Use for a binding package that is not a member of the root uv workspace, whose third-party
          imports pyrefly would otherwise fail to resolve.
        required: false
        type: string
        default: ""
      setup-java:
        description: "Install a JDK so poly's checkstyle project check (mvn checkstyle:check) can run against Java bindings."
        required: false
        type: boolean
        default: false
      java-version:
        description: "JDK version for setup-java (checkstyle 13+ requires 21+; match the binding's maven.compiler.release)."
        required: false
        type: string
        default: "21"
      java-distribution:
        description: "JDK distribution for setup-java."
        required: false
        type: string
        default: "temurin"
      setup-go:
        description: "Install Go and golangci-lint so poly's golangci-lint project check can run against Go bindings."
        required: false
        type: boolean
        default: false
      go-version:
        description: "Go version for setup-go."
        required: false
        type: string
        default: "stable"
      golangci-lint-version:
        description: "golangci-lint version to install (module path tag, e.g. v2.12.2)."
        required: false
        type: string
        default: "v2.12.2"
      go-working-directory:
        description: "Directory holding the Go module, used to resolve its toolchain."
        required: false
        type: string
        default: "packages/go"
      setup-ruby:
        description: "Install Ruby and the binding's bundle so poly's rubocop and steep project checks can run."
        required: false
        type: boolean
        default: false
      ruby-version:
        description: "Ruby version for setup-ruby."
        required: false
        type: string
        default: "3.4"
      ruby-working-directory:
        description: "Directory holding the Ruby binding's Gemfile."
        required: false
        type: string
        default: "packages/ruby"
      setup-dart:
        description: "Install Dart and resolve the binding's pub deps so poly's dart-analyze project check can run."
        required: false
        type: boolean
        default: false
      dart-version:
        description: "Dart SDK version for setup-dart."
        required: false
        type: string
        default: "stable"
      dart-working-directory:
        description: "Directory holding the Dart binding's pubspec.yaml."
        required: false
        type: string
        default: "packages/dart"
      setup-elixir:
        description: "Install Elixir/OTP so poly's credo project check can run against Elixir bindings."
        required: false
        type: boolean
        default: false
      elixir-version:
        description: "Elixir version for setup-elixir."
        required: false
        type: string
        default: "1.19"
      otp-version:
        description: "OTP version for setup-elixir."
        required: false
        type: string
        default: "28"
      elixir-working-directory:
        description: "Directory holding the Elixir binding's mix.exs."
        required: false
        type: string
        default: "packages/elixir"
      runner:
        description: "Runner label(s) to run on. Use a GitHub-hosted label such as ubuntu-latest or ubuntu-24.04-arm; the org self-hosted pools were retired."
        required: false
        type: string
        default: "ubuntu-latest"
      poly-version:
        description: "poly version to install. Empty (default) installs the latest release; set to pin a specific version."
        required: false
        type: string
        default: ""
      install-system-deps:
        description: >-
          Run this repo's install-system-deps composite action before linting (Linux only, requires
          setup-rust). Builds libheif from source (Ubuntu's package is too old for libheif-sys) plus
          Tesseract and other native deps, so poly's cargo-clippy hook can compile Rust crates with
          native FFI dependencies. Opt-in because the build is expensive even when cached; only enable it
          if the workspace's clippy build actually needs these system libraries.
        required: false
        type: boolean
        default: false
      check-fixture-snippets:
        description: >-
          Generate fixture-backed documentation snippets, fail if tracked files drift, and run the
          configured strict snippet checks. Requires [crates.e2e.snippets] and docs snippet configuration
          in alef.toml.
        required: false
        type: boolean
        default: false
      alef-version:
        description: "Alef version passed to install-alef@v1 for fixture snippet checks."
        required: false
        type: string
        default: "latest"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (poly)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        if: ${{ inputs.setup-rust }}
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ${{ inputs.rust-components }}
          install-llvm-cov: "false"

      # ~keep opt-in: xberg's tools/benchmark-harness pulls in libheif-sys via the
      # `full` feature, and Ubuntu Noble only ships libheif 1.17.6 (libheif-sys needs
      # >= 1.21), which makes the cargo-clippy hook fail with a pkg-config error. This
      # composite action builds/caches libheif 1.23.0 from source. It is gated behind
      # its own input rather than folded into setup-rust because it also installs
      # Tesseract and other unrelated native deps, and even the cached path is not free
      # — most Rust-enabled callers of this reusable workflow don't need any of it.
      - name: Install system dependencies (libheif for cargo-clippy)
        if: ${{ inputs.setup-rust && inputs.install-system-deps && runner.os == 'Linux' }}
        uses: xberg-io/actions/install-system-deps@v1

      - name: Set up Python
        if: ${{ inputs.setup-python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        if: ${{ inputs.setup-python }}
        uses: astral-sh/setup-uv@v10.0.1

      # ~keep --no-install-workspace skips building/installing the workspace's own
      # package(s) (e.g. a maturin-backed extension), which pyrefly never needs — it
      # type-checks source against the checked-in `.pyi` stub, not an installed wheel.
      # Building the extension for real pulls in the crate's full native dependency
      # graph (e.g. libheif-sys), which this job has no system libs for and which
      # previously turned a should-be-cheap dep sync into a multi-minute failure that
      # `continue-on-error` silently swallowed.
      # ~keep Guarded on the manifest existing, not just on `setup-python`: `uv sync`
      # exits 2 with "No `pyproject.toml` found" in a repo that has loose `.py` files
      # worth linting but no uv project (alef). Those callers still want the
      # interpreter set up for pyrefly, so gate the sync rather than the whole block —
      # the "Activate the synced venv" step below already tolerates a missing `.venv`.
      - name: Sync Python deps
        if: ${{ inputs.setup-python && hashFiles('pyproject.toml') != '' }}
        run: uv sync --no-install-workspace

      # ~keep pyrefly resolves imports against the interpreter it is handed, which is the
      # runner's system Python unless the synced venv is put on PATH — so every third-party
      # import in a binding package reads as `missing-import` no matter what `uv sync` did.
      - name: Activate the synced venv
        if: ${{ inputs.setup-python }}
        run: |
          if [ -d .venv ]; then
            echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          else
            echo "no .venv to activate"
          fi

      # ~keep A binding package outside the root uv workspace has its own dependencies that
      # the root `uv sync` never installs (tree-sitter-language-pack's packages/python needs
      # `tree-sitter`), leaving pyrefly unable to resolve them.
      - name: Install extra Python projects
        if: ${{ inputs.setup-python && inputs.python-extra-projects != '' }}
        # ~keep Passed through env, not interpolated into the script: a `${{ }}` expansion
        # inside `run` is substituted before the shell sees it, so any caller-supplied value
        # would be executed as shell.
        env:
          EXTRA_PROJECTS: ${{ inputs.python-extra-projects }}
        run: |
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            echo "installing $project"
            uv pip install -e "$project"
          done <<< "$EXTRA_PROJECTS"

      - name: Set up Java
        if: ${{ inputs.setup-java }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Go
        if: ${{ inputs.setup-go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.go-working-directory }}/go.sum

      # Installed from source rather than via golangci-lint-action, which runs the
      # linter itself — here poly is the one that invokes it, so only the binary is
      # wanted on PATH. `go install` puts it in GOPATH/bin, already on PATH. ~keep
      - name: Install golangci-lint
        if: ${{ inputs.setup-go }}
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ inputs.golangci-lint-version }}

      - name: Set up Ruby
        if: ${{ inputs.setup-ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
          working-directory: ${{ inputs.ruby-working-directory }}

      - name: Set up Dart
        if: ${{ inputs.setup-dart }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ inputs.dart-version }}

      # `dart analyze` resolves nothing itself and reports every package import as
      # an error until the deps are on disk. ~keep
      - name: Resolve Dart deps
        if: ${{ inputs.setup-dart }}
        working-directory: ${{ inputs.dart-working-directory }}
        run: dart pub get

      - name: Set up Elixir
        if: ${{ inputs.setup-elixir }}
        uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}

      # ~keep poly delegates Elixir formatting to `mix format`, which reads the project's
      # `.formatter.exs` — and `import_deps: [:rustler]` there needs the deps on disk. Without
      # this, `mix format` errors, poly logs a warning and treats the file as unchanged, and
      # Elixir drift passes CI unnoticed. `setup-elixir` already installs hex/rebar, so
      # `mix deps.get` fetching ordinary Hex packages (jason, rustler, rustler_precompiled,
      # credo, ex_doc) has no known failure mode here — a failure is a real problem
      # (registry outage, a broken dep constraint) that should fail the job, not hide behind
      # a swallowed exit code the way it did before.
      - name: Resolve Elixir deps
        if: ${{ inputs.setup-elixir }}
        working-directory: ${{ inputs.elixir-working-directory }}
        run: mix deps.get

      # ~keep poly delegates C, C++, and C# formatting to clang-format, so its version decides
      # whether `poly fmt --check` passes. Without this the job silently used the runner image's
      # clang-format 18, which rewrites `object? x` to `object ? x` and failed correct generated
      # C#. Installed unconditionally: an absent formatter makes poly skip those files instead,
      # which is how drift reaches main in the first place. Nothing here runs cppcheck or
      # shellcheck, and on Linux a cppcheck version miss builds it from source.
      - name: Set up clang-format
        uses: xberg-io/actions/setup-c-cpp-tools@v1
        with:
          install-cppcheck: "false"
          install-shellcheck: "false"

      - name: Install alef CLI
        if: ${{ inputs.check-fixture-snippets }}
        uses: xberg-io/actions/install-alef@v1
        with:
          version: ${{ inputs.alef-version }}

      - name: Generate fixture snippets
        if: ${{ inputs.check-fixture-snippets }}
        run: alef e2e generate

      - name: Check fixture snippet drift
        if: ${{ inputs.check-fixture-snippets }}
        run: git diff --exit-code

      - name: Validate fixture snippets
        if: ${{ inputs.check-fixture-snippets }}
        run: alef snippets check --strict --cache off

      - name: Resolve latest poly version
        id: poly-latest
        if: ${{ inputs.poly-version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Goldziher/poly@v0 resolves "latest" with `gh`, which is absent on
          # self-hosted ARC runners. Resolve the tag via the REST API (curl) so
          # latest works everywhere, then pass it to the action as an explicit
          # version (skipping the action's own gh-based path). Capture the full
          # response first — piping curl straight into `grep -m1` makes grep
          # close the pipe early, so curl dies with a write error (exit 23).
          response="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Goldziher/poly/releases/latest)"
          tag="$(printf '%s\n' "$response" | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          if [ -z "$tag" ]; then
            echo "::error::failed to resolve latest poly release from the GitHub API" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved latest poly: $tag"

      - name: Install poly
        uses: Goldziher/poly@v0
        with:
          version: ${{ inputs.poly-version != '' && inputs.poly-version || steps.poly-latest.outputs.version }}

      - name: Format check
        run: poly fmt --check .

      - name: Lint
        run: poly lint .
