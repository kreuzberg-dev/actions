name: Test fetch-test-documents
on:
  push:
    paths:
      - "fetch-test-documents/**"
      - ".github/workflows/test-fetch-test-documents.yml"
  pull_request:
    paths:
      - "fetch-test-documents/**"
      - ".github/workflows/test-fetch-test-documents.yml"

jobs:
  missing-manifest-fails-clearly:
    name: Missing manifest fails clearly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage a submodule directory with no corpus.lock.json
        shell: bash
        run: mkdir -p "${{ runner.temp }}/no-manifest/test_documents"

      - name: Action fails before touching the network
        id: fetch
        continue-on-error: true
        uses: ./fetch-test-documents
        with:
          path: ${{ runner.temp }}/no-manifest/test_documents

      - name: Confirm the failure
        shell: bash
        run: |
          [ "${{ steps.fetch.outcome }}" = "failure" ] || {
            echo "expected failure, got ${{ steps.fetch.outcome }}"
            exit 1
          }

  # ~keep Windows and macOS are here for path handling, not coverage breadth, so the include is two
  # files rather than a directory. GitHub hands composite actions native paths on Windows
  # (`D:\a\_actions\...`, `D:\a\_temp`), which bash mangles into nonsense unless converted; that bug
  # shipped once and only xberg's runners caught it, because this workflow was ubuntu-only.
  cross-platform-path-handling:
    name: Path handling on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Checkout test_documents
        uses: actions/checkout@v7
        with:
          repository: xberg-io/test_documents
          path: test_documents
          lfs: false

      # ~keep cache: false is required for the objects-fetched assertion below to mean anything. The
      # cache key is derived from the manifest and the include patterns, so a push to main and the
      # tags it moves produce concurrent runs sharing one key: whichever lands first populates the
      # cache and the rest legitimately download 0 objects. Disabling the cache here makes the
      # download path — the thing this job exists to exercise on Windows and macOS — always run.
      - name: Fetch two small objects
        id: fetch
        uses: ./fetch-test-documents
        with:
          path: test_documents
          include: |
            images/test.heic
            images/alpha.heif
          concurrency: "2"
          cache: "false"

      - name: Assert both files hold real bytes at their manifest checksum
        shell: bash
        run: |
          set -euo pipefail
          for rel in images/test.heic images/alpha.heif; do
            file="test_documents/${rel}"
            [ -f "$file" ] || { echo "::error::not materialised: ${rel}"; exit 1; }
            expected=$(jq -r --arg p "$rel" '.objects[$p].sha256' test_documents/corpus.lock.json)
            if command -v sha256sum >/dev/null 2>&1; then
              actual=$(sha256sum "$file" | cut -d' ' -f1)
            else
              actual=$(shasum -a 256 "$file" | cut -d' ' -f1)
            fi
            [ "$actual" = "$expected" ] || { echo "::error::${rel}: expected ${expected}, got ${actual}"; exit 1; }
            echo "ok ${rel} ${actual}"
          done
          [ "${{ steps.fetch.outputs.objects-fetched }}" = "2" ] || {
            echo "::error::expected 2 objects fetched, got ${{ steps.fetch.outputs.objects-fetched }}"
            exit 1
          }

  # ~keep Exercises the real public bucket with no credentials configured, which is the property
  # that matters: fork PRs get no OIDC token, so any regression that reintroduces an auth
  # requirement must fail here rather than only for outside contributors.
  subset-fetch-from-live-bucket:
    name: Subset fetch against the live bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ~keep lfs: false is the whole point — the action must supply the bytes, so leaving LFS
      # unfetched is what makes the assertions below meaningful rather than accidentally satisfied.
      - name: Checkout test_documents
        uses: actions/checkout@v7
        with:
          repository: xberg-io/test_documents
          path: test_documents
          lfs: false

      - name: Fetch a pdf-only subset
        id: fetch
        uses: ./fetch-test-documents
        with:
          path: test_documents
          include: |
            pdf/**
          concurrency: "4"

      # ~keep Asserts on CONTENT, not on which paths exist. Checkout without `lfs: true` already
      # leaves an LFS pointer file at every corpus path, so the action overwrites in place and adds
      # no new paths — "did a file appear" cannot detect materialisation. A path outside the include
      # set is allowed to be absent (post-LFS) or still a pointer (pre-LFS), but never real content.
      - name: Assert pdf/ holds real bytes and the include scope was honoured
        shell: bash
        run: |
          set -euo pipefail
          pointer='version https://git-lfs.github.com'
          jq -r '.objects | keys[]' test_documents/corpus.lock.json | sort > "${{ runner.temp }}/paths.txt"
          grep '^pdf/'    "${{ runner.temp }}/paths.txt" > "${{ runner.temp }}/included.txt"
          grep -v '^pdf/' "${{ runner.temp }}/paths.txt" > "${{ runner.temp }}/excluded.txt"

          [ -s "${{ runner.temp }}/included.txt" ] || { echo "::error::manifest has no pdf/ entries"; exit 1; }

          failures=0
          while IFS= read -r rel; do
            file="test_documents/${rel}"
            if [ ! -f "$file" ]; then
              echo "::error::included path was not materialised: ${rel}"
              failures=$((failures + 1))
            elif head -c 64 "$file" | grep -qF "$pointer"; then
              echo "::error::included path is still an LFS pointer: ${rel}"
              failures=$((failures + 1))
            fi
          done < "${{ runner.temp }}/included.txt"

          while IFS= read -r rel; do
            file="test_documents/${rel}"
            if [ -f "$file" ] && ! head -c 64 "$file" | grep -qF "$pointer"; then
              echo "::error::excluded path holds real content, so the include scope leaked: ${rel}"
              failures=$((failures + 1))
            fi
          done < "${{ runner.temp }}/excluded.txt"

          [ "$failures" -eq 0 ] || { echo "::error::${failures} assertion failure(s)"; exit 1; }
          echo "materialised $(wc -l < "${{ runner.temp }}/included.txt") pdf/ path(s); $(wc -l < "${{ runner.temp }}/excluded.txt") excluded path(s) untouched"

      - name: Assert outputs are populated
        shell: bash
        env:
          OBJECTS_FETCHED: ${{ steps.fetch.outputs.objects-fetched }}
          BYTES_FETCHED: ${{ steps.fetch.outputs.bytes-fetched }}
        run: |
          set -euo pipefail
          [ -n "$OBJECTS_FETCHED" ]
          [ -n "$BYTES_FETCHED" ]
          [ "$BYTES_FETCHED" -ge 0 ]

      - name: Re-run in the same job is idempotent and downloads nothing new
        id: refetch
        uses: ./fetch-test-documents
        with:
          path: test_documents
          include: |
            pdf/**
          concurrency: "4"

      - name: Confirm the second run fetched zero objects
        shell: bash
        env:
          OBJECTS_FETCHED: ${{ steps.refetch.outputs.objects-fetched }}
        run: |
          [ "$OBJECTS_FETCHED" = "0" ] || {
            echo "::error::expected 0 objects on the second run, got ${OBJECTS_FETCHED}"
            exit 1
          }
