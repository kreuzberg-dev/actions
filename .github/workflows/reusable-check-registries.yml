name: Check Package Registries

on:
  workflow_call:
    inputs:
      version:
        description: "Version to check (without v prefix)"
        required: true
        type: string
      registries:
        description: >
          JSON array of registry check configs. Each object must have:
          - name: unique identifier for this check (used in output keys)
          - registry: registry type (pypi, npm, cratesio, nuget, rubygems, hex, maven, packagist, homebrew, github-release)
          - package: package name to check
          Optional fields:
          - extra-packages: newline-separated key=package pairs for checking additional packages.
            Their individual results are not separate outputs; a check with extra packages
            reports `true` only when the package and every extra exist.
          - tap-repo: Homebrew tap repository (required for homebrew registry)
          - tag: GitHub release tag (for github-release registry, defaults to v{version})
          - assets: required release assets (for github-release)
          - asset-prefix: asset name prefix (for github-release)
          - repo: GitHub repo (for github-release)
        required: true
        type: string
    outputs:
      results:
        description: "JSON object mapping check names to boolean exists values"
        value: ${{ jobs.aggregate.outputs.results }}

jobs:
  check:
    name: Check ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(inputs.registries) }}
    steps:
      - name: Check registry
        id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: ${{ matrix.check.registry }}
          package: ${{ matrix.check.package }}
          version: ${{ inputs.version }}
          extra-packages: ${{ matrix.check.extra-packages || '' }}
          tap-repo: ${{ matrix.check.tap-repo || '' }}
          tag: ${{ matrix.check.tag || '' }}
          assets: ${{ matrix.check.assets || '' }}
          asset-prefix: ${{ matrix.check.asset-prefix || '' }}
          repo: ${{ matrix.check.repo || '' }}

      - name: Write check result
        # A matrix job has one output namespace shared by every leg: a job-level `outputs:`
        # block on a matrixed job collapses to whichever leg finishes last, silently discarding
        # every other leg's value. Each leg writes its own result to a uniquely-named artifact
        # instead, so the aggregate job below can fan them back in without depending on
        # completion order.
        id: write-result
        env:
          CHECK_NAME: ${{ matrix.check.name }}
          CHECK_RESULT: ${{ steps.check.outputs.all-exist }}
        run: |
          set -euo pipefail
          # Callers compare `fromJson(...).name != 'true'` -- a string comparison -- so the
          # verdict must stay a JSON string ("true"/"false"), never `--argjson`'s parsed
          # boolean: GitHub Actions casts a boolean/string mismatch to numbers, and `true`
          # casts to `1` while `'true'` casts to NaN, so `true != 'true'` is always true. An
          # empty verdict (the check step succeeded but set no `all-exist` output) fails this
          # step loudly instead of writing a silent "" that would also read as not-published.
          if [[ -z "$CHECK_RESULT" ]]; then
            echo "::error::check step for '${CHECK_NAME}' produced no all-exist output" >&2
            exit 1
          fi
          mkdir -p results
          jq -n --arg name "$CHECK_NAME" --arg result "$CHECK_RESULT" '{($name): $result}' \
            > "results/${CHECK_NAME}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: check-registries-result-${{ matrix.check.name }}
          path: results/*.json
          retention-days: 1

  aggregate:
    name: Aggregate registry results
    needs: check
    if: always()
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.aggregate.outputs.results }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: check-registries-result-*
          path: results
          merge-multiple: true

      - name: Aggregate check results
        id: aggregate
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(results/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            RESULTS='{}'
          else
            RESULTS=$(jq -s -c 'add' "${files[@]}")
          fi
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
