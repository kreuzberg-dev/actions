name: Test validate-versions
on:
  push:
    paths:
      - "validate-versions/**"
      - ".github/workflows/test-validate-versions.yml"
  pull_request:
    paths:
      - "validate-versions/**"
      - ".github/workflows/test-validate-versions.yml"

jobs:
  matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage matching-version fixture at workspace root
        shell: bash
        run: |
          cat >Cargo.toml <<'TOML'
          [workspace]
          members = []
          [workspace.package]
          version = "1.2.3"
          TOML
          cat >package.json <<'JSON'
          {"name": "fixture", "version": "1.2.3"}
          JSON
          cat >alef.toml <<'TOML'
          [workspace]
          languages = ["node"]

          [[crates]]
          name = "fixture"
          TOML

      - name: Validate matching versions (expect success)
        id: ok
        uses: ./validate-versions
        with:
          alef-version: latest

      - name: Confirm matching manifest was accepted
        shell: bash
        env:
          VALID: ${{ steps.ok.outputs.valid }}
        run: |
          # The mismatch job below proves this fixture shape discovers package.json.
          if [[ "${VALID}" != "true" ]]; then
            echo "expected valid=true, got valid=${VALID}"
            exit 1
          fi

  mismatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage mismatch fixture
        shell: bash
        run: |
          cat >Cargo.toml <<'TOML'
          [workspace]
          members = []
          [workspace.package]
          version = "1.2.3"
          TOML
          cat >package.json <<'JSON'
          {"name": "fixture", "version": "9.9.9"}
          JSON
          cat >alef.toml <<'TOML'
          [workspace]
          languages = ["node"]

          [[crates]]
          name = "fixture"
          TOML

      - name: Validate mismatched versions (expect failure)
        id: bad
        uses: ./validate-versions
        continue-on-error: true
        with:
          alef-version: latest

      - name: Confirm mismatch was rejected
        shell: bash
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: |
          if [[ "${OUTCOME}" != "failure" ]]; then
            echo "expected mismatch validation to fail, got outcome=${OUTCOME}"
            exit 1
          fi
