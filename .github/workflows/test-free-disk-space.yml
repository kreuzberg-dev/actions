name: Test free-disk-space-linux
on:
  push:
    paths:
      - "free-disk-space-linux/**"
      - ".github/workflows/test-free-disk-space.yml"
  pull_request:
    paths:
      - "free-disk-space-linux/**"
      - ".github/workflows/test-free-disk-space.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record initial disk space
        run: df -h /

      - name: Pull image that must survive cleanup
        run: docker pull alpine:3.23

      - name: Free disk space
        uses: ./free-disk-space-linux

      - name: Verify disk space freed
        run: df -h /

      - name: Verify prepared Docker action images survive cleanup
        run: docker image inspect alpine:3.23

      # Regression guard: the cleanup used to delete /usr/local/lib/node_modules, which left
      # /usr/local/bin/npm as a dangling symlink. `npm` stayed on PATH and every call failed with
      # ENOENT, breaking pnpm/action-setup in consumers far from the cause. Assert npm is not just
      # present but actually executable.
      - name: Verify npm still works after cleanup
        run: |
          set -euo pipefail
          if [ -L /usr/local/bin/npm ] && [ ! -e /usr/local/bin/npm ]; then
            echo "::error::/usr/local/bin/npm is a dangling symlink after cleanup"
            exit 1
          fi
          command -v npm
          npm --version
          command -v node
          node --version
