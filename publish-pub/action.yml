name: Publish to pub.dev
description: >
  Publish Dart packages to pub.dev using OIDC trusted publishing.
  Requires the workflow to have `permissions: id-token: write` and the
  package to be configured for automated publishing on pub.dev (one-time
  setup per package). Handles already-published versions idempotently.

inputs:
  package-dir:
    description: "Directory containing pubspec.yaml"
    required: false
    default: "."
  dart-version:
    description: "Dart SDK version (passed to dart-lang/setup-dart). Use 'stable' for latest stable."
    required: false
    default: "stable"
  setup-dart:
    description: "Whether to run dart-lang/setup-dart. Set to 'false' if Dart is already installed."
    required: false
    default: "true"
  natives-dir:
    description: "Optional directory containing per-RID native libraries to bundle into packages/dart/lib/src/native/<rid>/"
    required: false
    default: ""
  dry-run:
    description: "Perform a dry run without actually publishing"
    required: false
    default: "false"
  expected-version:
    description: >
      Version of the release being published (a leading `v` is stripped). When set, the
      pubspec.yaml version must equal this or the action fails before publishing.
      Leaving it empty preserves the old behaviour but disables the stale-artifact guard,
      and the action warns loudly.
    required: false
    default: ""

outputs:
  skipped:
    description: "Whether the publish step was skipped because the version was already published"
    value: ${{ steps.publish.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Set up Dart SDK
      if: inputs.setup-dart == 'true'
      uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      with:
        sdk: ${{ inputs.dart-version }}
        # setup-dart registers its problem matcher at `$GITHUB_ACTION_PATH/dart-analyzer.json`.
        # Nested in a composite action that path resolves to THIS action's directory, which has
        # no such file, so the step dies and every publish step after it is skipped. ~keep
        problem-matcher: "false"

    - name: Verify pubspec.yaml carries the release version
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
        INPUT_EXPECTED_VERSION: ${{ inputs.expected-version }}
      run: |
        # ~keep This pre-flight is what makes the "already published, skipping" branch of the
        # publish step safe, and the two must not be collapsed. That branch's
        # `version.*already exists` pattern looks version-aware but is not: it matches pub.dev's
        # message about whatever version pubspec.yaml declared, so a stale package resolves to a
        # skip. tree-sitter-language-pack v1.16.0 and liter-llm v1.19.0 both reported success
        # having published nothing that way. Skipping is legitimate ONLY once the declared
        # version is known to be the release version.
        if [[ -z "${INPUT_EXPECTED_VERSION:-}" ]]; then
          echo "::warning::publish-pub was invoked without expected-version; a stale artifact cannot be detected and an 'already published' response will be treated as an idempotent skip. Pass the release version from the caller to close this gap."
          exit 0
        fi
        expected="${INPUT_EXPECTED_VERSION#v}"
        cd "$PACKAGE_DIR"
        # Same parse as the dry-run summary below, plus quote-stripping so a quoted
        # `version: "1.2.3"` compares equal.
        version=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d " \"'")
        if [[ -z "$version" ]]; then
          echo "::error::expected-version ${expected} was supplied but no version could be read from ${PACKAGE_DIR}/pubspec.yaml, so the package cannot be verified"
          exit 1
        fi
        if [[ "$version" != "$expected" ]]; then
          echo "::error::pubspec.yaml declares version ${version} but the release being published is ${expected}. The package is stale; publishing it would ship the wrong version or be silently swallowed as an 'already published' skip."
          exit 1
        fi
        echo "Verified pubspec.yaml carries the release version ${expected}"

    - name: Bundle native libraries
      shell: bash
      env:
        NATIVES_DIR: ${{ inputs.natives-dir }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        if [[ -n "$NATIVES_DIR" && -d "$NATIVES_DIR" ]]; then
          echo "Bundling native libraries from $NATIVES_DIR into package..."
          mkdir -p "$PACKAGE_DIR/lib/src/native"
          cp -r "$NATIVES_DIR"/* "$PACKAGE_DIR/lib/src/native/"
          echo "Native libraries bundled successfully"
        else
          echo "No natives-dir provided or directory does not exist; skipping native bundling"
        fi

    - name: Resolve dependencies
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        cd "$PACKAGE_DIR"
        dart pub get

    - name: Validate with pub publish --dry-run
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        cd "$PACKAGE_DIR"
        # Capture warnings but don't fail on them — the real publish will enforce.
        # Many alef-generated packages emit "homepage" / "documentation" warnings
        # that are non-fatal.
        dart pub publish --dry-run || true

    - name: Publish to pub.dev
      id: publish
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        cd "$PACKAGE_DIR"
        set +e
        output=$(dart pub publish --force 2>&1)
        exit_code=$?
        set -e

        echo "$output"

        if [[ $exit_code -eq 0 ]]; then
          echo "Published successfully"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
        elif echo "$output" | grep -qiE "version.*already exists|already been published|already in the registry"; then
          echo "Package already published, skipping"
          echo "skipped=true" >> "$GITHUB_OUTPUT"
        else
          echo "Error publishing to pub.dev:" >&2
          echo "$output" >&2
          exit 1
        fi

    - name: Dry run summary
      if: inputs.dry-run == 'true'
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        cd "$PACKAGE_DIR"
        name=$(grep '^name:' pubspec.yaml | head -1 | awk '{print $2}')
        version=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
        echo "[dry-run] Would publish ${name}@${version} to pub.dev"
        echo "skipped=false" >> "$GITHUB_OUTPUT"
