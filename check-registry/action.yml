name: Check Registry for Existing Version
description: |
  Query a package registry to determine if a specific version already exists.
  Backed by `alef check-registry`. Supports: pypi, npm, wasm, rubygems, hex,
  maven (groupId:artifactId), nuget, cratesio, packagist, homebrew (tap),
  github-release.
inputs:
  registry:
    description: "Registry to check"
    required: true
  package:
    description: "Package name (e.g. 'xberg', '@xberg-io/node-linux-x64-gnu', 'io.xberg:xberg')"
    required: true
  version:
    description: "Version to check for"
    required: true
  extra-packages:
    description: |
      Additional packages to check (one per line, format: output_key=package_name).
      Each is queried with the same registry and version.

      A composite action can only propagate the outputs it declares, so the per-line
      keys are NOT step outputs on the caller — reading `steps.<id>.outputs.<key>`
      yields an empty string. Consume the results through `results` (a JSON object
      keyed by `exists` plus every key here) or `all-exist`.
    required: false
    default: ""
  tap-repo:
    description: "Homebrew tap repository (owner/repo). Required for homebrew."
    required: false
    default: ""
  tag:
    description: >
      GitHub release tag the caller expects to be queried — github-release only. `alef
      check-registry` has no tag option: it always derives the tag from `version`, so this
      cannot redirect the query. It is asserted instead — supplying a tag that names a
      different version than `version` fails the step rather than silently answering about
      the wrong release.
    required: false
    default: ""
  asset-prefix:
    description: "Asset name prefix to match (forwarded to alef when supported) — github-release only."
    required: false
    default: ""
  assets:
    description: "Comma-separated list of required asset names — github-release only."
    required: false
    default: ""
  repo:
    description: "GitHub repository (owner/repo) — github-release only."
    required: false
    default: ""
  source:
    description: "NuGet source URL (defaults to https://api.nuget.org)."
    required: false
    default: ""
  alef-version:
    description: "Alef CLI version to install (semver, 'latest', or 'main')."
    required: false
    default: "latest"
outputs:
  exists:
    description: "Whether the primary package version exists (true/false)."
    value: ${{ steps.check.outputs.exists }}
  all-exist:
    description: >
      Whether the primary package and every `extra-packages` entry exist (true/false).
      Equals `exists` when `extra-packages` is empty.
    value: ${{ steps.check.outputs.all-exist }}
  results:
    description: >
      JSON object mapping `exists` and every `extra-packages` output key to a boolean,
      e.g. `{"exists":true,"cli_exists":false}`. Read a single key with
      `fromJSON(steps.<id>.outputs.results).cli_exists`.
    value: ${{ steps.check.outputs.results }}
runs:
  using: composite
  steps:
    - name: Fetch alef.toml so install-alef can read the pin
      if: inputs.alef-version == 'latest'
      shell: bash
      run: |
        if [[ ! -f alef.toml ]]; then
          if curl --silent --fail --location \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/alef.toml" \
              -o alef.toml; then
            echo "Fetched alef.toml from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          else
            rm -f alef.toml
            echo "No alef.toml at ${GITHUB_REPOSITORY}@${GITHUB_SHA} — install-alef will resolve latest from GitHub"
          fi
        fi

    - name: Install alef
      uses: xberg-io/actions/install-alef@v1
      with:
        version: ${{ inputs.alef-version }}

    - name: Check registry
      id: check
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        TAP_REPO: ${{ inputs.tap-repo }}
        REPO_INPUT: ${{ inputs.repo }}
        SOURCE: ${{ inputs.source }}
        ASSET_PREFIX: ${{ inputs.asset-prefix }}
        REQUIRED_ASSETS: ${{ inputs.assets }}
        TAG: ${{ inputs.tag }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # ~keep `alef check-registry` takes no tag option — for `github-release` it derives the
        # tag from `--version` — so the `tag` input cannot redirect the query and was declared,
        # documented as an override, and then dropped on the floor. Two repos pass it. Assert the
        # assumption the action silently makes instead: if the caller's tag names a version other
        # than `version`, the answer would be about a different release, so say so rather than
        # returning a confident result for the wrong tag.
        if [[ -n "${TAG}" && "${TAG#v}" != "${VERSION#v}" ]]; then
          echo "::error::tag ${TAG} and version ${VERSION} name different releases, and alef check-registry can only query the tag implied by version. Pass a tag that matches the version, or drop the tag input." >&2
          exit 1
        fi

        # A check that cannot be completed is reported as "not published". Every caller uses
        # this action as an idempotency guard in front of a publish step that is itself
        # idempotent, so failing open costs a redundant publish attempt while failing closed
        # would strand a release on a transient registry hiccup. ~keep
        UNKNOWN_RESULT=false

        run_alef_check() {
          local pkg="$1"
          local max_attempts=5
          local attempt=1
          local backoff=2
          local exit_code output

          while [[ $attempt -le $max_attempts ]]; do
            local args=(check-registry --registry "${REGISTRY}" --package "${pkg}" --version "${VERSION}" --json)
            if [[ -n "${TAP_REPO}" ]]; then
              args+=(--tap-repo "${TAP_REPO}")
            fi
            if [[ -n "${REPO_INPUT}" ]]; then
              args+=(--repo "${REPO_INPUT}")
            fi
            if [[ -n "${SOURCE}" ]]; then
              args+=(--source "${SOURCE}")
            fi
            if [[ -n "${ASSET_PREFIX}" ]]; then
              args+=(--asset-prefix "${ASSET_PREFIX}")
            fi
            if [[ -n "${REQUIRED_ASSETS}" ]]; then
              args+=(--required-assets "${REQUIRED_ASSETS}")
            fi

            # `if alef ...; then return 0; fi` followed by `$?` always read 0: an `if` with no
            # `else` leaves `$?` at 0 when the condition is false, so every failure looked like
            # a success and the caller got empty stdout. Capture the status off the command
            # itself. Buffering stdout also keeps a failed attempt's output out of the result. ~keep
            exit_code=0
            output=$(alef "${args[@]}") || exit_code=$?

            if [[ $exit_code -eq 0 ]]; then
              printf '%s\n' "${output}"
              return 0
            fi

            if [[ $attempt -lt $max_attempts ]]; then
              echo "Attempt $attempt failed with exit code $exit_code, retrying in ${backoff}s..." >&2
              sleep "$backoff"
              backoff=$((backoff * 2))
              attempt=$((attempt + 1))
            else
              echo "Max retries ($max_attempts) exhausted for package: $pkg" >&2
              return "$exit_code"
            fi
          done

          return 1
        }

        # Sets `package_exists` to "true" or "false". Messages go to stdout so `::warning::`
        # reaches the runner as an annotation; the result travels by variable rather than by
        # stdout capture so the two cannot collide. ~keep
        check_package() {
          local pkg="$1"
          local status=0
          local json

          package_exists="${UNKNOWN_RESULT}"

          json=$(run_alef_check "${pkg}") || status=$?

          if [[ $status -ne 0 ]]; then
            echo "::warning::Registry check for ${pkg}@${VERSION} on ${REGISTRY} failed (exit ${status}); treating it as not published"
            return 0
          fi

          if ! package_exists=$(jq -e -r 'if .exists == true then "true" else "false" end' <<<"${json}" 2>/dev/null); then
            package_exists="${UNKNOWN_RESULT}"
            echo "::warning::Registry check for ${pkg}@${VERSION} on ${REGISTRY} returned unparseable output; treating it as not published"
          fi
        }

        record_result() {
          local key="$1" value="$2"
          # `jq --argjson` exits 2 on anything that is not JSON, which turned a failed check into
          # a crashed step. Nothing but a boolean is ever a meaningful answer here. ~keep
          if [[ "${value}" != "true" && "${value}" != "false" ]]; then
            echo "::warning::Registry check for '${key}' produced a non-boolean result; recording ${UNKNOWN_RESULT}"
            value="${UNKNOWN_RESULT}"
          fi
          results=$(jq -c --arg key "${key}" --argjson value "${value}" '. + {($key): $value}' <<<"${results}")
        }

        results='{}'

        # Primary package check.
        check_package "${PACKAGE}"
        primary_exists="${package_exists}"
        echo "exists=${primary_exists}" >>"$GITHUB_OUTPUT"
        record_result exists "${primary_exists}"
        all_exist="${primary_exists}"
        echo "Primary check: ${PACKAGE}@${VERSION} on ${REGISTRY} -> exists=${primary_exists}"

        # Extra packages: same registry/version. Their keys cannot be declared as action
        # outputs (they come from the input, and a composite action propagates only what its
        # `outputs:` block names), so they are folded into `results` and `all-exist`. Writing
        # them to $GITHUB_OUTPUT as bare keys is what made them look wired up while every
        # caller read an empty string.
        if [[ -n "${EXTRA_PACKAGES}" ]]; then
          while IFS= read -r line; do
            line="$(echo "${line}" | xargs)"
            [[ -z "${line}" ]] && continue
            output_key="${line%%=*}"
            extra_pkg="${line#*=}"
            check_package "${extra_pkg}"
            extra_exists="${package_exists}"
            record_result "${output_key}" "${extra_exists}"
            if [[ "${extra_exists}" != "true" ]]; then
              all_exist=false
            fi
            echo "Extra check (${output_key}): ${extra_pkg}@${VERSION} on ${REGISTRY} -> exists=${extra_exists}"
          done <<<"${EXTRA_PACKAGES}"
        fi

        echo "all-exist=${all_exist}" >>"$GITHUB_OUTPUT"
        echo "results=${results}" >>"$GITHUB_OUTPUT"
        echo "Aggregate: all-exist=${all_exist} results=${results}"
