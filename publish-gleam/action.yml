name: Publish Gleam Package to Hex.pm
description: >
  Publish Gleam packages to Hex.pm via `gleam publish`.
  Gleam packages live alongside Elixir packages on Hex; this action uses the
  same `HEX_API_KEY` credential as `publish-hex`.
  Handles already-published versions idempotently.

inputs:
  package-dir:
    description: "Directory containing gleam.toml"
    required: false
    default: "."
  setup-beam:
    description: "Whether to install Erlang/OTP + Gleam via erlef/setup-beam@v1. Set to 'false' if already installed."
    required: false
    default: "true"
  otp-version:
    description: "Erlang/OTP version (passed to erlef/setup-beam)"
    required: false
    default: "27"
  gleam-version:
    description: "Gleam version (passed to erlef/setup-beam)"
    required: false
    default: "1.18"
  replace:
    description: "Allow replacing an existing published version (Hex --replace flag)"
    required: false
    default: "true"
  dry-run:
    description: "Perform a dry run without actually publishing"
    required: false
    default: "false"
  expected-version:
    description: >
      Version of the release being published (a leading `v` is stripped). When set, the
      gleam.toml version must equal this or the action fails before publishing.
      Leaving it empty preserves the old behaviour but disables the stale-artifact guard,
      and the action warns loudly.
    required: false
    default: ""

outputs:
  skipped:
    description: "Whether the publish step was skipped because the version was already published"
    value: ${{ steps.publish.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Set up BEAM (Erlang/OTP + Gleam)
      if: inputs.setup-beam == 'true'
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ inputs.otp-version }}
        gleam-version: ${{ inputs.gleam-version }}

    - name: Verify HEX_API_KEY is set
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        HEX_API_KEY: ${{ env.HEX_API_KEY }}
      run: |
        if [[ -z "${HEX_API_KEY:-}" ]]; then
          echo "Error: HEX_API_KEY environment variable not set" >&2
          echo "Set it in the calling workflow's env or job-level env block." >&2
          exit 1
        fi

    - name: Verify gleam.toml carries the release version
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
        INPUT_EXPECTED_VERSION: ${{ inputs.expected-version }}
      run: |
        # ~keep This pre-flight is what makes the "already published, skipping" branch of the
        # publish step safe, and the two must not be collapsed. Skipping is legitimate ONLY when
        # the version being skipped is the release version (an idempotent re-run); when the
        # checked-out/built package is stale it is silent data loss. tree-sitter-language-pack
        # v1.16.0 and liter-llm v1.19.0 both reported success having published nothing, because a
        # stale artifact matched the already-published check for a version that was already live.
        if [[ -z "${INPUT_EXPECTED_VERSION:-}" ]]; then
          echo "::warning::publish-gleam was invoked without expected-version; a stale artifact cannot be detected and an 'already published' response will be treated as an idempotent skip. Pass the release version from the caller to close this gap."
          exit 0
        fi
        expected="${INPUT_EXPECTED_VERSION#v}"
        cd "$PACKAGE_DIR"
        # Same parse as the dry-run summary below, with `\s` spelled as the POSIX class so it
        # also works under BSD sed (where `\s` matches nothing and swallows the whole line).
        version=$(grep '^version' gleam.toml | head -1 | sed 's/.*=[[:space:]]*"\(.*\)".*/\1/')
        if [[ -z "$version" ]]; then
          echo "::error::expected-version ${expected} was supplied but no version could be read from ${PACKAGE_DIR}/gleam.toml, so the package cannot be verified"
          exit 1
        fi
        if [[ "$version" != "$expected" ]]; then
          echo "::error::gleam.toml declares version ${version} but the release being published is ${expected}. The package is stale; publishing it would ship the wrong version or be silently swallowed as an 'already published' skip."
          exit 1
        fi
        echo "Verified gleam.toml carries the release version ${expected}"

    - name: Build Gleam package
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        cd "$PACKAGE_DIR"
        gleam build

    - name: Publish to Hex.pm
      id: publish
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        HEX_API_KEY: ${{ env.HEX_API_KEY }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
        REPLACE: ${{ inputs.replace }}
      run: |
        cd "$PACKAGE_DIR"
        PUBLISH_FLAGS="--yes"
        if [[ "$REPLACE" == "true" ]]; then
          PUBLISH_FLAGS="${PUBLISH_FLAGS} --replace"
        fi

        set +e
        # shellcheck disable=SC2086
        output=$(gleam publish $PUBLISH_FLAGS 2>&1)
        exit_code=$?
        set -e

        echo "$output"

        if [[ $exit_code -eq 0 ]]; then
          echo "Published successfully"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
        elif echo "$output" | grep -qiE "already published|version already exists|already been published"; then
          echo "Package already published, skipping"
          echo "skipped=true" >> "$GITHUB_OUTPUT"
        else
          echo "Error publishing Gleam package:" >&2
          echo "$output" >&2
          exit 1
        fi

    - name: Dry run summary
      if: inputs.dry-run == 'true'
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        cd "$PACKAGE_DIR"
        name=$(grep '^name' gleam.toml | head -1 | sed 's/.*=\s*"\(.*\)".*/\1/')
        version=$(grep '^version' gleam.toml | head -1 | sed 's/.*=\s*"\(.*\)".*/\1/')
        echo "[dry-run] Would publish ${name}@${version} to Hex.pm via gleam publish"
        echo "skipped=false" >> "$GITHUB_OUTPUT"
